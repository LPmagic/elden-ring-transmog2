; Saved transmog outfits, loaded independently from ertransmogrify.ini.
;
; Each line is: SetName = head_id,chest_id,arms_id,legs_id
; Protector ids can be found using Smithbox/Yapped (EquipParamProtector table).
;
; Use 0 or -1 for a slot to leave it alone - whatever you're currently wearing
; (real armor or an existing transmog) in that slot is untouched when the set
; is applied. Omitting a slot (e.g. only writing 3 values) has the same effect.
;
; To make a slot appear bare/naked instead, use the game's own "Invisible"
; protector ids:
;   Head:  10000
;   Chest: 10100
;   Arms:  10200
;   Legs:  10300
;
; These appear as a "Saved Sets" option in the Transmogrify Armor menu at any
; Site of Grace, above "Dispel transmogrification" - selecting one applies all
; 4 pieces at once.
[sets]
Carian Knight = 980000,980100,980200,980300
Carian Knight (Altered) = 980000,981100,980200,980300
